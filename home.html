<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Payoo | Login</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <header class="flex justify-between items-center px-6 py-8 sticky top-0 z-10 bg-base-200">
        <div class="left flex gap-2 items-center">
            <div class="home-logo w-[60px]">
                <img src="assets/logo.png" alt="">
            </div>
            <div class="balance">
                <h2 class="font-extrabold text-[18px] text-neutral">$ <span id="total-balance">45000</span></h2>
                <p class="text-neutral/50">Available Balance</p>
            </div>
        </div>
        <div class="right">
            <a href="index.html" class="btn btn-primary btn-soft rounded-lg">
                <i class="fa-solid fa-arrow-right-from-bracket rotate-180"></i>
                <p>Logout</p>
            </a>
        </div>
    </header>

    <section class="welcome">
        <div class="welcome-container max-w-[400px] mx-auto space-y-4">
            <h1 class="font-bold text-2xl text-neutral">Welcome to Pay<span class="text-[#7460FF]">oo</span></h1>
            <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
        </div>
    </section>

    <section class="buttons">
        <div class="button-container max-w-[400px] mx-auto my-6 grid grid-cols-3 gap-4">
            <button class="btn flex-col h-full  btn-primary btn-soft rounded-xl">
                <img src="assets/opt-1.png" alt="">
                <p>Add Money</p>
            </button>
            <button class="btn flex-col h-full  btn-primary btn-soft rounded-xl">
                <img src="assets/opt-2.png" alt="">
                <p>Cashout</p>
            </button>
            <button class="btn flex-col h-full py-4 btn-primary btn-soft rounded-xl">
                <img src="assets/opt-3.png" alt="">
                <p>Transfer Money</p>
            </button>
            <button class="btn flex-col h-full py-7 btn-primary btn-soft rounded-xl">
                <img src="assets/opt-4.png" alt="">
                <p>Get Bonus</p>
            </button>
            <button class="btn flex-col h-full  btn-primary btn-soft rounded-xl">
                <img src="assets/opt-5.png" alt="">
                <p>Pay Bill</p>
            </button>
            <button class="btn flex-col h-full  btn-primary btn-soft rounded-xl">
                <img src="assets/opt-6.png" alt="">
                <p>Transactions</p>
            </button>
        </div>
    </section>

    <section class="add-money ">
        <div class="add-money-container pt-5 pb-25">
            <h2 class="text-neutral font-semibold text-[18px] ml-7">Add Money</h2>
            <div class="form pt-5 ">
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-3xl">
                    <div class="card-body">
                      <fieldset class="fieldset">
                        <label class="label font-medium text-[16px] text-neutral">Select A Bank</label>
                        <select id="add-money-bank" class="select bg-base-200 rounded-full w-full">
                            <option disabled selected>Select bank</option>
                            <option>Dhaka Bank</option>
                            <option>Jamuna Bank</option>
                            <option>City Bank</option>
                          </select>
                          <br>

                        <label class="label font-medium text-[16px] text-neutral">Bank Account Number</label>
                        <input id="bank-number" type="text" maxlength="11" minlength="11" class="input bg-base-200 rounded-full w-full" placeholder="Enter 11 digit account number" />
                        <br>
                        <label class="label font-medium text-[16px] text-neutral">Amount to Add</label>
                        <input id="add-amount" type="number" class="input bg-base-200 rounded-full w-full" placeholder="Add Amount to withdraw" />
                        <br>
                        <label class="label font-medium text-[16px] text-neutral">4 Digit Pin</label>
                        <input id="add-money-pin" type="password" maxlength="4" class="input bg-base-200 rounded-full w-full" placeholder="Enter 4 digit pin number" />
                        <button id="add-money-btn" class="btn btn-primary mt-4 rounded-full w-full">Add Money</button>
                      </fieldset>
                    </div>
                  </div>
            </div>
        </div>
    </section>

    <section class="cashout hidden">
        <div class="cashout-container pt-5 pb-25">
            <h2 class="text-neutral font-semibold text-[18px] ml-7">Cash Out</h2>
            <div class="form pt-5 ">
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-3xl">
                    <div class="card-body">
                      <fieldset class="fieldset">
                        <label class="label font-medium text-[16px] text-neutral">Agent Number</label>
                        <input id="cashout-agent" type="text" maxlength="11" minlength="11" class="input bg-base-200 rounded-full w-full" placeholder="Enter 11 digit number" />
                        <br>
                        <label class="label font-medium text-[16px] text-neutral">Amount</label>
                        <input id="cashout-amount" type="number" class="input bg-base-200 rounded-full w-full" placeholder="Enter amount to withdraw" />
                        <br>
                        <label class="label font-medium text-[16px] text-neutral">4 Digit Pin</label>
                        <input id="cashout-pin" type="password" maxlength="4" class="input bg-base-200 rounded-full w-full" placeholder="Enter 4 digit pin number" />
                        <button id="withdraw-btn" class="btn btn-primary mt-4 rounded-full w-full">Withdraw Money</button>
                      </fieldset>
                    </div>
                  </div>
            </div>
        </div>
    </section>

    <section class="transfer-money hidden">
        <div class="transfer-container pt-5 pb-25">
            <h2 class="text-neutral font-semibold text-[18px] ml-7">Transfer Money</h2>
            <div class="form pt-5 ">
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-3xl">
                    <div class="card-body">
                      <fieldset class="fieldset">
                        <label class="label font-medium text-[16px] text-neutral">User Account Number</label>
                        <input id="transfer-account-number" type="text" maxlength="11" minlength="11" class="input bg-base-200 rounded-full w-full" placeholder="Enter 11 digit number" />
                        <br>
                        <label class="label font-medium text-[16px] text-neutral">Amount</label>
                        <input id="transfer-amount" type="number" class="input bg-base-200 rounded-full w-full" placeholder="Enter amount to transfer" />
                        <br>
                        <label class="label font-medium text-[16px] text-neutral">Pin Number</label>
                        <input id="transfer-pin" type="password" maxlength="4" class="input bg-base-200 rounded-full w-full" placeholder="Enter 4 digit pin number" />
                        <button id="transfer-btn" class="btn btn-primary mt-4 rounded-full w-full">Send Now</button>
                      </fieldset>
                    </div>
                  </div>
            </div>
        </div>
    </section>

    <section class="get-bonus hidden">
        <div class="bonus-container pt-5 pb-25">
            <h2 class="text-neutral font-semibold text-[18px] ml-7">Get Bonus</h2>
            <div class="form pt-5 ">
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-3xl">
                    <div class="card-body">
                      <fieldset class="fieldset">
                        <label class="label font-medium text-[16px] text-neutral">Enter Bonus Coupon</label>
                        <input id="bonus-coupon" type="text" class="input bg-base-200 rounded-full w-full" placeholder="Enter your coupon" />
                       
                        <button id="bonus-btn" class="btn btn-primary mt-4 rounded-full w-full">Get Bonus</button>
                      </fieldset>
                    </div>
                  </div>
            </div>
        </div>
    </section>

    <section class="pay-bill hidden">
        <div class="cashout-container pt-5 pb-25">
            <h2 class="text-neutral font-semibold text-[18px] ml-7">Pay Bill</h2>
            <div class="form pt-5 ">
                <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-3xl">
                    <div class="card-body">
                      <fieldset class="fieldset">
                        <label class="label font-medium text-[16px] text-neutral">Select To Pay</label>
                        <select id="select-to-pay" class="select bg-base-200 rounded-full w-full">
                            <option disabled selected>Select to pay bill</option>
                            <option>Electricity Bill</option>
                            <option>Gas Bill</option>
                            <option>Wifi Bill</option>
                          </select>
                          <br>

                        <label class="label font-medium text-[16px] text-neutral">Biller Account Number</label>
                        <input id="bill-account-number" type="text" maxlength="11" minlength="11" class="input bg-base-200 rounded-full w-full" placeholder="Enter account number" />
                        <br>
                        <label class="label font-medium text-[16px] text-neutral">Amount to Pay</label>
                        <input id="pay-amount" type="number" class="input bg-base-200 rounded-full w-full" placeholder="Add Amount to pay" />
                        <br>
                        <label class="label font-medium text-[16px] text-neutral">Pin Number</label>
                        <input id="pay-pin" type="password" maxlength="4" class="input bg-base-200 rounded-full w-full" placeholder="Enter 4 digit pin number" />
                        <button id="pay-btn" class="btn btn-primary mt-4 rounded-full w-full">Pay Now</button>
                      </fieldset>
                    </div>
                  </div>
            </div>
        </div>
    </section>

    <section class="transaction">
        <div class="transaction-container max-w-sm mx-auto pt-5 pb-20">
            <div class="transaction-title flex justify-between items-center mb-4">
                <h2 class="text-neutral font-semibold text-[18px] ">Transaction History</h2>
                <p class="text-neutral/50 text-[14px]">View All</p>
            </div>
            <div id="transaction-card-container" class="transaction-cards space-y-4">
                
            </div>
        </div>
    </section>

    <script src="script/machine.js"></script>
    <script src="script/addMoney.js"></script>
    <script src="script/cashout.js"></script>
    <script src="script/transfer.js"></script>
    <script src="script/bonus.js"></script>
    <script src="script/pay.js"></script>
</body>
</html>
