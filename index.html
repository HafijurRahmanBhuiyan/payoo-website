<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>Payoo | Login</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <style>
        *{
            font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class="min-h-screen max-w-md bg-base-200 mx-auto">
    <div class="logo w-[263px] mx-auto pt-40">
        <img src="assets/Logo-full.png" alt="">
    </div>
    <div class="form pt-20 ">
        <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto rounded-3xl">
            <div class="card-body">
              <fieldset class="fieldset">
                <label class="label font-medium text-[16px] text-neutral">Mobile Number</label>
                <input id="number-input" type="text" maxlength="11" minlength="11" class="input bg-base-200 rounded-full" placeholder="Enter your number" />
                <br>
                <label class="label font-medium text-[16px] text-neutral">4 Digit Pin</label>
                <input id="pin-input" type="text" maxlength="4" class="input bg-base-200 rounded-full" placeholder="Enter 4 Digit Pin" />
                <button id="login-btn" class="btn btn-primary mt-4 rounded-full">Login</button>
              </fieldset>
            </div>
          </div>
    </div>

    <script src="script/login.js"></script>
</body>
</html>
